
<h2 mat-dialog-title>Withdraw</h2>

<mat-dialog-content>

  <p>Current Balance</p>

  <!-- Preserve the team's currency formatting. -->
  <h3>{{ currentBalance() | centsIntegerToDollarString }}</h3>

  <mat-form-field appearance="outline">
    <mat-label>Withdraw Amount</mat-label>

    <!-- Preserve the team's numeric input validation. -->
    <input
      matInput
      placeholder="0"
      min="0.01"
      [(ngModel)]="withdrawalAmount"
      appNumericInput
      [decimals]="2"
      inputmode="decimal"
      [disabled]="isLoading() || !!successMessage()"
    >

    <span matTextPrefix>$&nbsp;</span>
  </mat-form-field>

  <!-- Show Boone's progress bar while processing. -->
  @if (isLoading()) {
    <app-progress-bar [showProgress]="isLoading()" />
    <p>Processing withdrawal...</p>
  }

  <!-- Display errors from the transaction service. -->
  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <!-- Confirm a successful withdrawal. -->
  @if (successMessage()) {
    <p>{{ successMessage() }}</p>
  }

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    mat-dialog-close
    [disabled]="isLoading() || !!successMessage()">
    Cancel
  </button>

  <!-- Preserve insufficient-funds validation. -->
  <button
    mat-raised-button
    [disabled]="
      withdrawalCents <= 0 ||
      withdrawalCents > currentBalance() ||
      isLoading() ||
      !!successMessage()
    "
    (click)="submitWithdrawal()">
    {{ isLoading() ? 'Processing...' : 'Withdraw' }}
  </button>

</mat-dialog-actions>
