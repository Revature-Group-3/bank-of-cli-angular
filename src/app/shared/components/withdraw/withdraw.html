
<h2 mat-dialog-title>Withdraw</h2>

<mat-dialog-content>

  <!-- Display the current account balance. -->
  <p>Current Balance</p>
  <h3>{{ currentBalance() | centsIntegerToDollarString }}</h3>

  <!-- Enter a withdrawal amount. -->
  <mat-form-field appearance="outline">
    <mat-label>Withdraw Amount</mat-label>

    <input
      matInput
      type="number"
      min="0.01"
      step="0.01"
      [(ngModel)]="withdrawalAmount"
      [disabled]="isLoading() || !!successMessage()"
    >
  </mat-form-field>

  <!-- Reuse the team's existing progress bar. -->
  <app-progress-bar [showProgress]="isLoading()" />

  <!-- Show a message while processing. -->
  @if (isLoading()) {
    <p>Processing withdrawal...</p>
  }

  <!-- Show the error if the withdrawal is rejected. -->
  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <!-- Show confirmation after success. -->
  @if (successMessage()) {
    <p>{{ successMessage() }}</p>
  }

</mat-dialog-content>

<mat-dialog-actions align="end">

  <!-- Do not allow cancellation during processing. -->
  <button
    mat-button
    mat-dialog-close
    [disabled]="isLoading() || !!successMessage()">
    Cancel
  </button>

  <!-- Prevent invalid and duplicate withdrawals. -->
  <button
    mat-raised-button
    [disabled]="
      withdrawalCents <= 0 ||
      withdrawalCents > currentBalance() ||
      isLoading() ||
      !!successMessage()
    "
    (click)="submitWithdrawal()">
    {{ isLoading() ? 'Processing...' : 'Withdraw' }}
  </button>

</mat-dialog-actions>
