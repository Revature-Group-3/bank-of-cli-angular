
<h2 mat-dialog-title>Transfer</h2>

<mat-dialog-content>

  <!-- Display the current balance. -->
  <p>Current Balance</p>
  <h3>{{ currentBalance() | centsIntegerToDollarString }}</h3>

  <!-- Enter the transfer amount. -->
  <mat-form-field appearance="outline">
    <mat-label>Transfer Amount</mat-label>

    <input
      matInput
      type="number"
      min="0.01"
      step="0.01"
      [(ngModel)]="transferAmount"
      [disabled]="isLoading() || !!successMessage()"
    >
  </mat-form-field>

  <!-- Enter the recipient's username. -->
  <mat-form-field appearance="outline">
    <mat-label>Recipient</mat-label>

    <input
      matInput
      type="text"
      maxlength="30"
      minlength="5"
      [(ngModel)]="recipient"
      [disabled]="isLoading() || !!successMessage()"
    >
  </mat-form-field>

  <!-- Show the existing progress bar while processing. -->
  <app-progress-bar [showProgress]="isLoading()" />

  <!-- Display a message during processing. -->
  @if (isLoading()) {
    <p>Processing transfer...</p>
  }

  <!-- Display any error returned by the service. -->
  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <!-- Confirm a successful transfer. -->
  @if (successMessage()) {
    <p>{{ successMessage() }}</p>
  }

</mat-dialog-content>

<mat-dialog-actions align="end">

  <!-- Prevent cancellation during processing. -->
  <button
    mat-button
    mat-dialog-close
    [disabled]="isLoading() || !!successMessage()">
    Cancel
  </button>

  <!-- Prevent invalid or duplicate transfers. -->
  <button
    mat-raised-button
    [disabled]="
      transferAmount <= 0 ||
      transferAmount > currentBalance() ||
      isLoading() ||
      !!successMessage()
    "
    [disabled]="transferCents <= 0 || transferCents > currentBalance()"
    (click)="submitTransfer()">
    {{ isLoading() ? 'Processing...' : 'Transfer' }}
  </button>

</mat-dialog-actions>
