
<h2 mat-dialog-title>Transfer</h2>

<mat-dialog-content>

  <p>Current Balance</p>

  <!-- Preserve the team's currency formatting. -->
  <h3>{{ currentBalance() | centsIntegerToDollarString }}</h3>

  <!-- Transfer amount input. -->
  <mat-form-field appearance="outline">
    <mat-label>Transfer Amount</mat-label>

    <!-- Preserve the team's numeric input validation. -->
    <input
      matInput
      placeholder="0"
      min="0.01"
      [(ngModel)]="transferAmount"
      appNumericInput
      [decimals]="2"
      inputmode="decimal"
      [disabled]="isLoading()"
    >

    <span matTextPrefix>$&nbsp;</span>
  </mat-form-field>

  <!-- Recipient username input. -->
  <mat-form-field appearance="outline">
    <mat-label>Recipient Username</mat-label>

    <input
      matInput
      type="text"
      maxlength="30"
      minlength="5"
      [(ngModel)]="recipient"
      [disabled]="isLoading()"
    >
  </mat-form-field>

  <!-- Display Boone's loading bar while processing. -->
  @if (isLoading()) {
    <app-progress-bar [showProgress]="isLoading()" />
    <p>Processing transfer...</p>
  }

  <!-- Show existing transaction errors. -->
  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

</mat-dialog-content>

<mat-dialog-actions align="end">

  <!-- Disable cancellation during processing. -->
  <button
    mat-button
    mat-dialog-close
    [disabled]="isLoading()">
    Cancel
  </button>

  <!-- Preserve the team's balance validation. -->
  <button
    mat-raised-button
    [disabled]="
      transferCents <= 0 ||
      transferCents > currentBalance() ||
      isLoading()
    "
    (click)="submitTransfer()">
    {{ isLoading() ? 'Processing...' : 'Transfer' }}
  </button>

</mat-dialog-actions>
