
<h2 mat-dialog-title>Deposit</h2>

<mat-dialog-content>

  <p>Current Balance</p>
  <h3>${{ currentBalance().toFixed(2) }}</h3>

  <mat-form-field appearance="outline">
    <mat-label>Deposit Amount</mat-label>

    <input
      matInput
      type="number"
      min="0.01"
      step="0.01"
      [(ngModel)]="depositAmount"
      [disabled]="isLoading() || successMessage() !== ''"
    >
  </mat-form-field>

  <!-- Show the progress bar while processing. -->
  <app-progress-bar
    [showProgress]="isLoading()">
  </app-progress-bar>

  <!-- Display the transaction outcome. -->
  @if (isLoading()) {
    <p>Processing deposit...</p>
  }

  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  @if (successMessage()) {
    <p>{{ successMessage() }}</p>
  }

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    mat-dialog-close
    [disabled]="isLoading() || successMessage() !== ''">
    Cancel
  </button>

  <button
    mat-raised-button
    [disabled]="isLoading() || successMessage() !== ''"
    (click)="submitDeposit()">

    @if (isLoading()) {
      Processing...
    } @else {
      Deposit
    }

  </button>

</mat-dialog-actions>
