
<h2 mat-dialog-title>Deposit</h2>

<mat-dialog-content>

  <p>Current Balance</p>

  <!-- Preserve the team's currency-formatting pipe. -->
  <h3>{{ currentBalance() | centsIntegerToDollarString }}</h3>

  <mat-form-field appearance="outline">
    <mat-label>Deposit Amount</mat-label>

    <!-- Preserve the team's numeric input validation. -->
    <input
      matInput
      placeholder="0"
      min="0.01"
      [(ngModel)]="depositAmount"
      appNumericInput
      [decimals]="2"
      inputmode="decimal"
      [disabled]="isLoading() || !!successMessage()"
    >

    <span matTextPrefix>$&nbsp;</span>
  </mat-form-field>

  <!-- Show Boone's progress bar during processing. -->
  @if (isLoading()) {
    <app-progress-bar [showProgress]="isLoading()" />
    <p>Processing deposit...</p>
  }

  <!-- Display errors from the transaction service. -->
  @if (errorMessage()) {
    <p class="error">{{ errorMessage() }}</p>
  }

  <!-- Display success confirmation. -->
  @if (successMessage()) {
    <p>{{ successMessage() }}</p>
  }

</mat-dialog-content>

<mat-dialog-actions align="end">

  <button
    mat-button
    mat-dialog-close
    [disabled]="isLoading() || !!successMessage()">
    Cancel
  </button>

  <button
    mat-raised-button
    [disabled]="depositCents <= 0 || isLoading() || !!successMessage()"
    (click)="submitDeposit()">
    {{ isLoading() ? 'Processing...' : 'Deposit' }}
  </button>

</mat-dialog-actions>
