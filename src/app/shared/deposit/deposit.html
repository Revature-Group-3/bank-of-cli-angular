<h2 mat-dialog-title>Deposit</h2>

<mat-dialog-content>

  <p>Current Balance</p>
  <h3>${{ currentBalance.toFixed(2) }}</h3>

  <mat-form-field appearance="outline">
    <mat-label>Deposit Amount</mat-label>
    <input
      matInput
      type="number"
      min="0.01"
      step="0.01"
      [(ngModel)]="depositAmount"
    >
  </mat-form-field>

</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>
    Cancel
  </button>

  <button mat-raised-button (click)="submitDeposit()">
    Deposit
  </button>
</mat-dialog-actions>
