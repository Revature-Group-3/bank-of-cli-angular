<div class="table-position">
  <div class="table-rows">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="Type">
        <th mat-header-cell *matHeaderCellDef class="first-column">Transaction Type</th>
        <td mat-cell *matCellDef="let transaction" class="first-column"> {{ transaction.transactionType }} </td>
      </ng-container>
      <ng-container matColumnDef="Date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let transaction">{{ transaction.date }}</td>
      </ng-container>
      <ng-container matColumnDef="Status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let transaction">{{ transaction.transactionStatus }}</td>
      </ng-container>
      <ng-container matColumnDef="Amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let transaction">{{ transaction.amount | currency:'USD' }}</td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let transaction; columns: displayedColumns"></tr>
    </table>
  </div>
</div>
